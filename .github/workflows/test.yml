name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Pest + SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, json
          coverage: pcov

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --dev

      - name: Run tests
        run: ./vendor/bin/pest --no-coverage --colors=never

      # Coverage no bloqueante: mostramos métricas en el log para hacer seguimiento
      # progresivo del 80% objetivo. Cuando la cobertura real lo alcance, eliminar
      # `continue-on-error` y añadir `--min=80` para que sea bloqueante.
      - name: Coverage report (non-blocking)
        if: always()
        continue-on-error: true
        run: ./vendor/bin/pest --coverage --coverage-text --colors=never
