name: ${MAYA_SLOT_PROJECT:-maya}-logs

services:

  # ─── Backend (Laravel 12 API) ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      APP_NAME: ${APP_NAME:-Log Management}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL}
      APP_LOCALE: ${APP_LOCALE:-es}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-es}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-es_ES}
      # ─── Base de datos (gestionada por infra/) ─────────────────
      DB_CONNECTION: pgsql
      DB_HOST: maya_infra_postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-log_mgmt_db}
      DB_USERNAME: ${DB_USERNAME:-log_mgmt_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      # ─── Usuario panel (permisos mínimos, lectura) ─────────────
      DB_PANEL_USERNAME: ${DB_PANEL_USERNAME:-panel_user}
      DB_PANEL_PASSWORD: ${DB_PANEL_PASSWORD:-}
      # ─── Sesión / Cache / Queue ─────────────────────────────────
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
      # ─── Redis (caché JWKS + perfil JWT en shared-auth-laravel) ─
      REDIS_HOST: ${REDIS_HOST:-maya_redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
      REDIS_DB: ${REDIS_DB:-0}
      # ─── Auth (gateway externo) ─────────────────────────────────
      AUTH_EXTERNAL_URL: ${AUTH_EXTERNAL_URL:-http://maya_auth_backend:8000}
      AUTH_EXTERNAL_PUBLIC_URL: ${AUTH_EXTERNAL_PUBLIC_URL}
      AUTH_MOCK_USER_ID: ${AUTH_MOCK_USER_ID:-1}
      # ─── Logging ────────────────────────────────────────────────
      LOG_CHANNEL: stack
      LOG_STACK: "daily,rabbit"
      LOG_LEVEL: debug
      LOG_RABBIT_LEVEL: warning
      # ─── RabbitMQ (broker compartido en maya_infra) ─────────────
      RABBITMQ_HOST: ${RABBITMQ_HOST:-maya_rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      MAYA_MESSAGING_APP: maya-logs
      # ─── JWT / JWKS ───────────────────────────────────────────
      JWKS_URL: ${JWKS_URL:-http://maya_auth_keycloak:8080/realms/maya/protocol/openid-connect/certs}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-maya-logs}
      JWT_ISSUER: ${JWT_ISSUER}
      # ─── CORS ─────────────────────────────────────────────────
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 150s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${MAYA_SLOT_PROJECT}-maya-logs-api.rule=Host(`${HOST_PREFIX}logs-api.${DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.${MAYA_SLOT_PROJECT}-maya-logs-api.service=${MAYA_SLOT_PROJECT}-maya-logs-api"
      - "traefik.http.routers.${MAYA_SLOT_PROJECT}-maya-logs-api.entrypoints=websecure"
      - "traefik.http.routers.${MAYA_SLOT_PROJECT}-maya-logs-api.tls=true"
      - "traefik.http.services.${MAYA_SLOT_PROJECT}-maya-logs-api.loadbalancer.server.port=8000"
    networks:
      - maya_network

  # ─── Worker: consumer AMQP logs.ingest → tabla logs ──────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      backend:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Log Management}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: maya_infra_postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-log_mgmt_db}
      DB_USERNAME: ${DB_USERNAME:-log_mgmt_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      CACHE_STORE: database
      REDIS_HOST: ${REDIS_HOST:-maya_redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
      REDIS_DB: ${REDIS_DB:-0}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-maya_rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      MAYA_MESSAGING_APP: maya-logs
      # ─── Logging ────────────────────────────────────────────────
      # IMPORTANTE: el worker NO debe publicar a 'rabbit' — consumiría sus
      # propios logs desde logs.ingest, generando un loop infinito.
      # Solo escribe a archivo local (daily). El backend HTTP sí puede usar
      # 'daily,rabbit' porque no consume colas.
      LOG_CHANNEL: stack
      LOG_STACK: "daily"
      LOG_LEVEL: info
      QUEUE_CONNECTION: database
      WORKER_LABEL: "[worker]"
      WORKER_WAIT_MIGRATION: create_logs_table
      WORKER_PATCH_CONSUMER: "1"
      WORKER_CONSUMERS: logs:consume
    entrypoint: ["/maya_infra/scripts/worker-entrypoint.sh"]
    command: []
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/node_modules
      - ../maya_infra/scripts:/maya_infra/scripts:ro
    networks:
      - maya_network

  # ─── Frontend (React 19 + Vite + TS) ─────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    # vitest + jsdom necesita >1g para suites medianas sin OOM (exit 137).
    mem_limit: 2g
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-maya}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-maya-logs}
      VITE_DASHBOARD_API_URL: ${VITE_DASHBOARD_API_URL}
    volumes:
      - ./frontend:/app
      - ../maya_infra/configs:/maya_infra/configs:ro
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5176}:5173"
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${MAYA_SLOT_PROJECT}-maya-logs-front.rule=Host(`${HOST_PREFIX}logs.${DOMAIN_SUFFIX}`)"
      - "traefik.http.routers.${MAYA_SLOT_PROJECT}-maya-logs-front.service=${MAYA_SLOT_PROJECT}-maya-logs-front"
      - "traefik.http.routers.${MAYA_SLOT_PROJECT}-maya-logs-front.entrypoints=websecure"
      - "traefik.http.routers.${MAYA_SLOT_PROJECT}-maya-logs-front.tls=true"
      - "traefik.http.services.${MAYA_SLOT_PROJECT}-maya-logs-front.loadbalancer.server.port=5173"
    networks:
      - maya_network

networks:
  maya_network:
    external: true
    name: maya_network
