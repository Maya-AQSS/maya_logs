{{- if .Values.worker.enabled -}}
{{- $component := "worker" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "maya-logs.componentName" (dict "component" $component) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "maya-logs.componentLabels" (dict "component" $component "Chart" .Chart "Release" .Release "Values" .Values) | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "maya-logs.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "maya-logs.componentSelectorLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- include "maya-logs.vaultAnnotations" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "maya-logs.image" (dict "root" .Values "componentImage" .Values.worker.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CONTAINER_ROLE
              value: {{ .Values.worker.containerRole | quote }}
            # Override de LOG_STACK: logs consume rabbit; el worker NUNCA debe
            # re-emitir logs por rabbit (loop infinito sobre la propia cola).
            - name: LOG_STACK
              value: {{ .Values.config.workerLogStack | quote }}
          envFrom:
            {{- include "maya-logs.envFrom" . | nindent 12 }}
          args:
            {{- toYaml .Values.worker.command | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          lifecycle:
            {{- include "maya-logs.preStop" . | nindent 12 }}
          # Healthcheck: el proceso `logs:consume` está vivo (cola activa).
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pgrep -f "logs:consume" >/dev/null'
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            {{- include "maya-logs.runtimeVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "maya-logs.runtimeVolumes" . | nindent 8 }}
{{- end -}}
