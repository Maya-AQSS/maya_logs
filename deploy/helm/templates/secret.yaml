{{- if not .Values.secret.externalName -}}
{{- /*
Guard de seguridad: si los valores aún contienen los placeholders "CHANGE-ME-*"
y el operador no ha permitido explícitamente la plantilla con
`--set secret.allowPlaceholders=true`, FALLAMOS el `helm install/upgrade`.
Esto previene que un release entre en producción con APP_KEY conocido.
*/}}
{{- if not .Values.secret.allowPlaceholders -}}
{{- range $key, $value := .Values.secret.data -}}
{{- if hasPrefix "CHANGE-ME" (toString $value) -}}
{{- fail (printf "secret.data.%s sigue con placeholder 'CHANGE-ME-*'. Define secret.externalName apuntando a un Secret creado fuera del chart (Sealed Secrets / kubectl) o pasa --set secret.allowPlaceholders=true SOLO para dry-run." $key) -}}
{{- end -}}
{{- end -}}
{{- end -}}
# ⚠️ PLANTILLA CON PLACEHOLDERS. Sobrescribir SIEMPRE en producción con:
#   kubectl -n {{ .Release.Namespace }} create secret generic {{ include "maya-logs.secretName" . }} \
#     --from-literal=APP_KEY="base64:<...>" \
#     --from-literal=DB_PASSWORD="<...>" \
#     ...
# o referenciar un Secret externo con --set secret.externalName=<nombre>.
# Sealed Secrets / etcd encryption es lo recomendado.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "maya-logs.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "maya-logs.labels" . | nindent 4 }}
  annotations:
    # Marcador: el deploy debe sobrescribir este Secret con valores reales.
    maya.ceedcv.es/placeholders: "true"
type: Opaque
stringData:
{{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end -}}
